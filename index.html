// ---------- 통계 ----------
function renderStats(){
  const rated = S.ratings.filter(x => x.stars != null);
  const roundOf = mv => S.rounds.find(r => r.id === mv.round_id);

  const mem = S.members.map(m => {
    const v = rated.filter(x => x.member_id === m.id).map(x => +x.stars);
    return { m, n:v.length, avg:mean(v) };
  });
  const memRated = mem.filter(x => x.n);
  const kind = memRated.length ? memRated.reduce((a, b) => b.avg > a.avg ? b : a) : null;
  const harsh = memRated.length ? memRated.reduce((a, b) => b.avg < a.avg ? b : a) : null;

  const rec = S.members.map(m => {
    const ids = new Set(S.movies.filter(mv => mv.kind === 'pick' && roundOf(mv)?.recommender_id === m.id).map(mv => mv.id));
    const v = rated.filter(x => ids.has(x.movie_id) && x.member_id !== m.id).map(x => +x.stars);
    return { m, picks:ids.size, avg:mean(v) };
  });

  const mvs = S.movies.map(mv => {
    const v = rated.filter(x => x.movie_id === mv.id).map(x => +x.stars);
    const a = mean(v);
    const sd = v.length > 1 ? Math.sqrt(v.reduce((s, x) => s + (x - a) ** 2, 0) / v.length) : 0;
    return { mv, r:roundOf(mv), n:v.length, avg:a, sd, lo:Math.min(...v), hi:Math.max(...v) };
  }).filter(x => x.n >= 2);

  S.statOpen ??= {};
  const topAll = [...mvs].sort((a, b) => b.avg - a.avg);
  const lowAll = [...mvs].sort((a, b) => a.avg - b.avg);
  const splitAll = [...mvs].filter(x => x.sd > 0).sort((a, b) => b.sd - a.sd);
  const cut = (arr, k) => S.statOpen[k] ? arr : arr.slice(0, 5);
  const top = cut(topAll, 'top'), low = cut(lowAll, 'low'), split = cut(splitAll, 'split');
  const more = (arr, k) => arr.length > 5
    ? `<button class="btn ghost small statmore" data-act="statMore" data-k="${k}">${S.statOpen[k] ? '접기 ▲' : `전체 보기 (${arr.length}편) ▼`}</button>` : '';
  const rank = (i, label) => `<span class="rk">${i + 1}</span>${label}`;

  const bar = (label, v, meta = '') =>
    `<div class="bar-row"><span class="bl">${label}${meta ? `<small>${meta}</small>` : ''}</span>
     <span class="bt"><span style="width:${v == null ? 0 : v / 5 * 100}%"></span></span>
     <span class="bv">${v == null ? '—' : v.toFixed(2)}</span></div>`;
  const where = x => x.r ? `${String(x.r.year).slice(2)}' ${periodLabel(x.r)}` : '';

  $('#main').innerHTML = `
    <div class="hero">
      <div><small>가장 후한 평론가</small><b>${kind ? esc(kind.m.name) : '—'}</b><span>${kind ? `평균 ${kind.avg.toFixed(2)}점` : ''}</span></div>
      <div><small>가장 짠 평론가</small><b>${harsh ? esc(harsh.m.name) : '—'}</b><span>${harsh ? `평균 ${harsh.avg.toFixed(2)}점` : ''}</span></div>
    </div>
    <div class="cols">
      <div class="panel"><h3>평론가별 평균 별점</h3><p class="d">각자 준 별점의 평균</p>
        ${mem.map(x => bar(esc(x.m.name), x.avg, `${x.n}편`)).join('')}</div>
      <div class="panel"><h3>추천 성적표</h3><p class="d">내 추천작에 다른 멤버들이 준 평균</p>
        ${rec.map(x => bar(esc(x.m.name), x.avg, `${x.picks}편`)).join('')}</div>
      <div class="panel"><h3>역대 최고 평점</h3><p class="d">2명 이상 평가한 영화</p>
        ${top.map((x, i) => bar(rank(i, esc(x.mv.title)), x.avg, where(x))).join('') || '<p class="d">아직 없어요</p>'}${more(topAll, 'top')}</div>
      <div class="panel"><h3>역대 최저 평점</h3><p class="d">2명 이상 평가한 영화</p>
        ${low.map((x, i) => bar(rank(i, esc(x.mv.title)), x.avg, where(x))).join('') || '<p class="d">아직 없어요</p>'}${more(lowAll, 'low')}</div>
    </div>
    <div class="panel"><h3>의견이 가장 갈린 영화</h3><p class="d">별점 편차가 큰 순서</p>
      ${split.map((x, i) => bar(rank(i, esc(x.mv.title)), x.avg, `최저 ${x.lo} · 최고 ${x.hi}`)).join('') || '<p class="d">아직 없어요</p>'}${more(splitAll, 'split')}</div>`;
}

// 내 평가
function openRate(mid, who){
  if (who !== S.me && !isAdmin()) who = S.me;
  const m = S.movies.find(x => x.id === mid);
  const mine = ratingsOf(mid).find(x => x.member_id === who);
  let val = mine?.stars != null ? Number(mine.stars) : null;
  const whoSel = isAdmin()
    ? `<div class="form" style="margin:8px 0 4px"><label class="full">누구의 평가<select id="who">${S.members.map(mb => `<option value="${mb.id}" ${mb.id === who ? 'selected' : ''}>${esc(mb.name)}${mb.id === S.me ? ' (나)' : ''}</option>`).join('')}</select></label></div>`
    : '';
  openModal(`<h3>${esc(m.title)}</h3>${whoSel}<p class="sub" style="margin:0">별 왼쪽을 누르면 반 개, 오른쪽을 누르면 한 개</p>
    <div class="picker" id="pk"></div><div class="pv" id="pv"></div>
    <textarea id="cm" rows="3" maxlength="300" placeholder="한줄평">${esc(mine?.comment ?? '')}</textarea>
    <p class="err" id="merr"></p>
    <div class="row">${mine ? '<button class="btn danger" id="del">삭제</button>' : ''}<span class="sp"></span>
      <button class="btn" id="cancel">취소</button><button class="btn primary" id="save">저장</button></div>`);
  const draw = () => {
    $('#pk').innerHTML = [1,2,3,4,5].map(i =>
      `<span class="pstar st ${val >= i ? 'on' : val >= i - .5 ? 'half' : ''}">★<button class="hl" data-v="${i - .5}" aria-label="${i - .5}점"></button><button class="hr" data-v="${i}" aria-label="${i}점"></button></span>`).join('');
    $('#pv').innerHTML = val != null ? `<strong>${val}점</strong> · <button class="link" id="clr">별점 지우기</button>` : '별점 없음';
  };
  draw();
  if ($('#who')) $('#who').onchange = () => openRate(mid, +$('#who').value);
  $('#pk').onclick = e => { const b = e.target.closest('button[data-v]'); if (b){ val = +b.dataset.v; draw(); } };
  $('#pv').onclick = e => { if (e.target.id === 'clr'){ val = null; draw(); } };
  $('#cancel').onclick = closeModal;
  const save = async (stars, comment) => {
    try { await call('mv_save_rating', { p_movie_id:mid, p_stars:stars, p_comment:comment, p_member_id:who }); await afterSave(); }
    catch(e){ if ($('#merr')) $('#merr').textContent = errMsg(e); }
  };
  $('#save').onclick = () => save(val, $('#cm').value);
  if (mine) $('#del').onclick = () => { if (confirm(`${who === S.me ? '내' : memName(who) + '님의'} 평가를 삭제할까요?`)) save(null, ''); };
}

      ${m && useTMDB() ? `<div class="full"><div style="font-size:12px;font-weight:600;color:var(--sub);margin-bottom:6px">포스터·영화 정보 (TMDB)</div>
        <div class="tm-cur" id="tmcur">${m.tmdb_id ? `${m.tmdb?.poster ? `<img src="${TMDB_IMG}w92${m.tmdb.poster}" alt="">` : ''}<div><b>${esc(m.tmdb?.title || '')}</b><br><small>${esc([m.tmdb?.year, m.tmdb?.director].filter(Boolean).join(' · '))}</small></div>`
          : m.tmdb_id === 0 ? '<div><small>정보 없음으로 지정됨</small></div>' : '<div><small>자동으로 찾는 중이에요</small></div>'}
          <button type="button" class="btn small" id="tmfind">다른 영화로 찾기</button></div>
        <div id="tmsearch" style="display:none">
          <div style="display:flex;gap:6px;margin-top:8px"><input id="tmq" value="${esc(searchTitle(m.title))}" placeholder="영화 제목"><button type="button" class="btn small" id="tmgo">검색</button></div>
          <div id="tmres" class="tm-res"></div>
          <button type="button" class="link" id="tmnone" style="margin-top:6px">포스터·정보 없이 두기</button>
        </div></div>` : ''}
      <div class="full"><div style="font-size:12px;font-weight:600;color:var(--sub);margin-bottom:6px">볼 수 있는 곳</div>
        <div class="pchk">${PLATFORMS.map(([n]) => `<label><input type="checkbox" value="${esc(n)}" ${(m?.platforms || []).includes(n) ? 'checked' : ''}>${esc(n)}</label>`).join('')}</div></div>
      <label id="sdL">관람 날짜<input id="fsd" type="date" value="${m?.event_date || ''}"></label>
      <label id="schL">장소 · 메모<input id="fsc" value="${esc(schedPlace(m))}" placeholder="예) 대전 명보시네마"></label>
    </div>
    <p class="err" id="merr"></p>
    <div class="row">${m ? '<button class="btn danger" id="del">영화 삭제</button>' : ''}<span class="sp"></span>
      <button class="btn" id="cancel">취소</button><button class="btn primary" id="save">저장</button></div>`);
  const toggle = () => {
    const g = $('#fk').value === 'group';
    $('#slotL').style.display = g ? 'none' : '';
    $('#schL').style.display = g ? '' : 'none';
    $('#sdL').style.display = g ? '' : 'none';
  };
  toggle(); $('#fk').onchange = toggle;
  $('#cancel').onclick = closeModal;
  if (m && useTMDB()){
    const search = async () => {
      $('#tmres').innerHTML = '<small class="note">검색 중…</small>';
      try {
        const res = (await tmdb('/search/movie', { query:$('#tmq').value })).results || [];
        $('#tmres').innerHTML = res.slice(0, 8).map(x => `<button type="button" class="tm-opt" data-tid="${x.id}">
          ${x.poster_path ? `<img src="${TMDB_IMG}w92${x.poster_path}" alt="">` : '<span class="ph">🎬</span>'}
          <span><b>${esc(x.title)}</b><br><small>${esc([(x.release_date || '').slice(0, 4), x.original_title !== x.title ? x.original_title : ''].filter(Boolean).join(' · '))}</small></span></button>`).join('')
          || '<small class="note">검색 결과가 없어요</small>';
      } catch(e){ $('#tmres').innerHTML = `<small class="err">${esc(e.message)}</small>`; }
    };
    $('#tmfind').onclick = () => { $('#tmsearch').style.display = ''; search(); };
    $('#tmgo').onclick = search;
    $('#tmq').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); search(); } };
    $('#tmres').onclick = async e => {
      const b = e.target.closest('[data-tid]'); if (!b) return;
      $('#tmres').innerHTML = '<small class="note">저장 중…</small>';
      try { await saveTmdb(m, +b.dataset.tid, await tmdbDetails(+b.dataset.tid)); closeModal(); }
      catch(err){ $('#merr').textContent = errMsg(err); }
    };
    $('#tmnone').onclick = async () => { try { await saveTmdb(m, 0, null); closeModal(); } catch(err){ $('#merr').textContent = errMsg(err); } };
  }
  $('#save').onclick = async () => {
    const g = $('#fk').value === 'group';
    try {
      await call('mv_save_movie', {
        p_id:m?.id ?? null, p_round_id:rid, p_kind:$('#fk').value,
        p_slot:g ? 9 : +$('#fs').value, p_title:$('#fti').value, p_schedule:g ? $('#fsc').value : '',
        p_platforms:[...document.querySelectorAll('.pchk input:checked')].map(x => x.value), p_event_date:g && $('#fsd').value ? $('#fsd').value : null });
      await afterSave();
    } catch(e){ $('#merr').textContent = errMsg(e); }
  };
  if (m) $('#del').onclick = async () => {
    if (!confirm(`'${m.title}'과 평가가 모두 지워져요. 삭제할까요?`)) return;
    try { await call('mv_delete_movie', { p_id:m.id }); await afterSave(); } catch(e){ $('#merr').textContent = errMsg(e); }
  };
}

// 비밀번호 변경
function openPassword(){
  openModal(`<h3>비밀번호 변경</h3>
    <div class="form">
      <label class="full">현재 비밀번호<input id="po" type="password" autocomplete="current-password"></label>
      <label class="full">새 비밀번호 (4자 이상)<input id="pn" type="password" autocomplete="new-password"></label>
      <label class="full">새 비밀번호 확인<input id="pn2" type="password" autocomplete="new-password"></label>
    </div>
    <p class="err" id="merr"></p>
    <div class="row"><span class="sp"></span><button class="btn" id="cancel">취소</button><button class="btn primary" id="save">변경</button></div>`);
  $('#cancel').onclick = closeModal;
  $('#save').onclick = async () => {
    if ($('#pn').value !== $('#pn2').value){ $('#merr').textContent = '새 비밀번호가 서로 달라요.'; return; }
    try {
      const ok = await call('mv_change_password', { p_old:$('#po').value, p_new:$('#pn').value });
      if (!ok){ $('#merr').textContent = '현재 비밀번호가 맞지 않아요.'; return; }
      closeModal(); alert('비밀번호를 바꿨어요.');
    } catch(e){ $('#merr').textContent = errMsg(e); }
  };
}

// ---------- 앱(PWA) ----------
if ('serviceWorker' in navigator){
  // 새 버전이 올라오면 앱이 알아서 받아서 한 번 새로고침
  let reloaded = false;
  const hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtrl && !reloaded){ reloaded = true; location.reload(); } });
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', { updateViaCache:'none' })
    .then(r => { r.update(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update(); }); })
    .catch(() => {}));
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; S.canInstall = true; if (S.me) render(); });
window.addEventListener('appinstalled', () => { S.canInstall = false; installEvt = null; if (S.me) render(); });
document.addEventListener('click', async e => {
  if (e.target.closest('#instbtn') && installEvt){ installEvt.prompt(); await installEvt.userChoice; installEvt = null; S.canInstall = false; if (S.me) render(); }
});
(() => {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let dismissed = false; try { dismissed = localStorage.getItem('mvclub_ioshint') === '1'; } catch(e){}
  if (!ios || standalone || dismissed) return;
  const bar = document.createElement('div');
  bar.className = 'ioshint';
  bar.innerHTML = `<div><b>앱처럼 쓰기</b><br>아래 <span class="share">공유 <svg width="13" height="15" viewBox="0 0 13 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5V1M3.5 4l3-3 3 3M2 7v6.5h9V7"/></svg></span> 버튼 → <b>홈 화면에 추가</b>를 누르세요</div><button aria-label="닫기">✕</button>`;
  bar.querySelector('button').onclick = () => { bar.remove(); try { localStorage.setItem('mvclub_ioshint', '1'); } catch(e){} };
  document.body.appendChild(bar);
})();

init().catch(e => { $('#app').innerHTML = `<div class="loading">오류: ${esc(errMsg(e))}</div>`; });
</script>
</body>
</html>
